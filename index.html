<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Neon Orbit — Composition Guide</title>
  <link rel="stylesheet" href="./styles/app.css?v=keyfirst3.55" />
</head>
<body>
  <div class="page-bg"></div>

  <div class="app-shell">
    <header class="hero-card">
      <div>
        <div class="kicker">Neon Orbit</div>
        <h1>Composition Guide</h1>
        <p>Local-first song and section workspace.</p>
      </div>
      <div class="hero-actions">
        <button class="btn secondary" id="loadIdeasBtn">Load idea pool</button>
        <button class="btn secondary" id="saveBtn">Save</button>
        <a class="btn secondary" id="exportMdBtn" href="#" role="button">Export MD</a>
        <a class="btn secondary" id="exportJsonBtn" href="#" role="button">Export JSON</a>
        <button class="btn secondary" data-open-panel="track">Track</button>
        <button class="btn secondary" data-open-panel="search">Ideas</button>
      </div>
    </header>

    <section class="status-card" id="statusCard">
      Loading app manifest…
    </section>

    <main class="wizard-card">
      <nav class="step-strip" id="stepStrip" aria-label="Wizard steps"></nav>

      <section class="screen-head">
        <div>
          <div class="kicker" id="screenKicker">Setup</div>
          <h2 id="screenTitle">Start</h2>
          <p id="screenBlurb">Choose one clear step at a time.</p>
        </div>
        <div class="progress-pill" id="progressPill">Step 1</div>
      </section>

      <section id="wizardBody" class="wizard-body"></section>

      <section class="wizard-controls">
        <button class="btn secondary" id="backBtn">Back</button>
        <div class="control-group">
          <button class="btn secondary" id="inspireBtn">Another idea</button>
          <button class="btn primary" id="nextBtn">Next</button>
        </div>
      </section>
    </main>

    <section class="drawer-grid utility-panel hidden" id="utilityPanel" aria-hidden="true">
      <div class="utility-panel-head">
        <strong id="utilityPanelTitle">Section</strong>
        <button class="btn small" id="panelCloseBtn">Close</button>
      </div>

      <details class="drawer" data-panel-view="section" open>
        <summary>Current section</summary>
        <div id="sectionSummary" class="mini-grid"></div>
      </details>

      <details class="drawer" data-panel-view="track" open>
        <summary>Track arrangement</summary>
        <div id="trackPanel" class="stack"></div>
      </details>

      <details class="drawer" data-panel-view="plan" open>
        <summary>Chosen prompts</summary>
        <div id="planSummary" class="stack"></div>
      </details>

      <details class="drawer" data-panel-view="trace" open>
        <summary>Source trace</summary>
        <div id="tracePanel" class="stack muted-box">Choose “Source” on a prompt.</div>
      </details>

      <details class="drawer" data-panel-view="search" open>
        <summary>Search ideas</summary>
        <div class="search-tools">
          <button class="btn secondary small" id="contextIdeasBtn">Current focus</button>
          <button class="btn secondary small" id="randomSearchBtn">Random fit</button>
        </div>
        <div class="search-row">
          <input id="searchInput" type="search" placeholder="Search prompt text, gear, domains, books…" />
          <button class="btn secondary" id="searchBtn">Search</button>
        </div>
        <div id="searchResults" class="stack"></div>
      </details>
    </section>
  </div>

  <div class="toast hidden" id="toast"></div>

  <script type="module" src="./src/main.js?v=keyfirst3.55"></script>
</body>
</html>
